<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: #222; padding: 20px; border-radius: 10px; }
        h1 { color: #e50914; }
        .download-btn { background-color: #e50914; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 MovieBox Portal</h1>
        <p>Welcome to your movie dashboard container.</p>
        <div id="movie-content-view">
            <h3>Sample Movie File</h3>
            <button class="download-btn" onclick="triggerAppDownload()">📥 Download Video</button>
        </div>
    </div>

    <!-- CRITICAL CORE INJECTIONS -->
    <script src="capacitor.js"></script>
    <script src="downloadVideo.js"></script>
    <script>
        function triggerAppDownload() {
            const targetUrl = "https://googleapis.com";
            const targetTitle = "Sample_Movie";
            if (typeof window.downloadMovieNatively === 'function') {
                window.downloadMovieNatively(targetUrl, targetTitle);
            } else {
                alert("Error: downloadVideo.js is missing or inaccessible.");
            }
        }
    </script>
</body>
</html>
