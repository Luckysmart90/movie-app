<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details Component</title>
</head>
<body>
    <!-- Template placeholder for rendering inside your repo layout -->
    <div id="movie-container"></div>

    <script>
    // Update the method rendering your active movie layout screen inside your index file.
    // Ensure you use backticks (`) around the innerHTML block so template variables evaluate correctly.
    function renderMovieDetails(activeMovie) {
        const downloadLink = activeMovie.download_url || "https://commondatastorage.googleapis.com";
        const movieTitle = activeMovie.title || "Unknown Title";
        const releaseYear = activeMovie.release_date ? activeMovie.release_date.split('-')[0] : 'N/A';
        const ratingScore = activeMovie.vote_average ? activeMovie.vote_average.toFixed(1) : '0.0';

        document.getElementById("movie-container").innerHTML = `
            <div class="movie-header">
                <h2>${movieTitle}</h2>
                <p>Release Year: ${releaseYear}</p>
                <p>⭐ ${ratingScore}</p>
            </div>

            <div class="download-section">
                <label>TARGET DOWNLOAD LINK</label>
                <input type="text" readonly value="${downloadLink}" id="download-url-input" />
                
                <!-- Explicit string sanitization prevents quotes from breaking native wrapper calls -->
                <button class="download-btn" onclick="window.downloadMovieNatively('${downloadLink}', '${movieTitle.replace(/'/g, "\\'")}')">
                    📥 Download video to Gallery
                </button>
            </div>
        `;
    }
    </script>
</body>
</html>
